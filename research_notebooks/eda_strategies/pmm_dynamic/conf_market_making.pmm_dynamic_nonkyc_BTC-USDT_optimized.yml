###############################################
# PMM Dynamic — Optuna-Optimized Configuration
# Generated from trial #402
# Objective value: -4.7171
# Levels: 2
###############################################

controller_name: pmm_dynamic
controller_type: market_making

connector_name: nonkyc
trading_pair: BTC-USDT

candles_connector: nonkyc
candles_trading_pair: BTC-USDT
interval: 5m

# -- MACD (trend detection / mid-price shift) --
macd_fast: 16
macd_slow: 32
macd_signal: 8

# -- NATR (volatility-adjusted spreads) --
natr_length: 9

# -- Capital --
total_amount_quote: 1000.0
leverage: 1

# -- Order levels (2 per side) --
buy_spreads:
  - 3.3
  - 3.8
sell_spreads:
  - 3.3
  - 3.8
buy_amounts_pct:
  - 45.95
  - 54.05
sell_amounts_pct:
  - 45.95
  - 54.05

# -- Risk management (triple barrier) --
stop_loss: 0.04
take_profit: 0.045
time_limit: 28800
trailing_stop:
  activation_price: 0.005
  trailing_delta: 0.002

# -- Execution --
executor_refresh_time: 360
cooldown_time: 15
