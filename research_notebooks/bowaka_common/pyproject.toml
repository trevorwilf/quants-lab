[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bowaka-common"
version = "0.1.0"
description = "Strategy-neutral data, calendar, storage, research, sim, metrics, and artifact infrastructure shared by bowaka_lab (v1) and bowaka_v2_lab (v2)."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pymongo>=4.6",
    "motor>=3.3.2",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "exchange-calendars>=4.5",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mongomock>=4.0",
    "ruff>=0.5",
    "black>=24.0",
    "isort>=5.12",
]
alpaca = [
    "alpaca-py>=0.30.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["bowaka_common*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running test",
    "live_mongo: requires a real MongoDB instance",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
target-version = "py310"
