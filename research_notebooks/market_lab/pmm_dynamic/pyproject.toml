[project]
name = "pmm-lab"
version = "0.1.0"
description = "PMM Dynamic Hyper-Bayesian Optimization for Hummingbot"
requires-python = ">=3.10"
# NOTE: Frozen regression tests (tests/regression/) must be run against the
# pinned environment in requirements-regression.txt. Dependency version drift
# can alter numerical output and invalidate golden values.
dependencies = [
    "numpy>=1.24",
    "pymongo>=4.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "pandas_ta>=0.3.14b1",
    "optuna>=3.0",
    "psycopg2-binary>=2.9",
    "nbformat>=5.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "mongomock>=4.0",
]
dev = [
    "pytest>=7.0",
    "mongomock>=4.0",
]

[tool.setuptools.packages.find]
include = ["pmm_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: expensive tests excluded from default fast lane (deselect with '-m \"not slow\"')",
    "integration: cross-module workflow tests",
    "parity: controller/fixture parity tests",
    "live_mongo: requires a live MongoDB instance",
    "live_hbot_db: requires a live Hummingbot PostgreSQL instance",
]
