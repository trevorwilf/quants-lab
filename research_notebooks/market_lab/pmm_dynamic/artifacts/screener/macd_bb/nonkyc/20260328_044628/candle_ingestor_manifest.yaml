backfill_days: 180
request_delay: 0.5
overlap_candles: 2
include_open_candle: false
http:
  timeout_seconds: 30.0
  max_retries: 3
  retry_backoff: 1.8
  user_agent: pmm-lab-screener/0.1
exchanges:
  nonkyc:
    enabled: true
    base_url: https://api.nonkyc.io/api/v2
    pairs:
    - ALGO/USDC
    - ARB/USDT
    - AAVE/USDT
    - ETC/USDT
    - LTC/USDT
    - SAL/USDT
    - SCASH/USDT
    - ZEC/USDT
    - ARB/USDC
    - ADA/USDT
    - EQPAY/USDT
    - SHIB/USDT
    - UNI/USDT
    - BTC/USDC
    - CAKE/USDC
    - PEP/DOGE
    - XLM/USDT
    - PEP/USDC
    - ARRR/USDT
    - PEP/USDT
    intervals:
    - 5m
    trades:
      enabled: true
      limit: 500
      update_recent_candles: false
      recent_window_minutes: 120
