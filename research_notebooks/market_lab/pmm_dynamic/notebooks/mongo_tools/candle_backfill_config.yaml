# Configuration for candle_backfill_v3.ipynb
#
# This file controls which exchanges to use, per-interval target depths,
# and rate-limit tuning. Edit this file when you want to:
#   - Add a new exchange (e.g., kraken)
#   - Adjust how far back a given interval backfills
#   - Change per-exchange request pacing

mongo:
  uri_env_var: MONGO_URI
  truenas_ip_env_var: TRUENAS_LAN_IP
  truenas_pass_env_var: MONGO_ROOT_PASSWORD
  default_truenas_ip: "192.168.1.54"
  default_truenas_pass: "mypass"
  database: quants_lab
  collection: candles
  probe_cache_collection: candle_coverage_probes

http:
  timeout_seconds: 30
  max_retries: 5
  retry_backoff: 1.8

# Target backfill depth per interval, in days. This is what v3 will ATTEMPT
# to fetch — the real stopping point is min(target_days, exchange-probed-floor).
#
# Use these as sensible defaults; edit per your storage/usage needs.
#   1m:  short (storage-heavy, usually only 30-90 days useful + exchange-capped)
#   3m:  moderate
#   5m:  1-2 years is typical for intraday backtesting
#   15m: 2-3 years
#   30m: 3-5 years
#   1h:  5-10 years
#   4h:  10 years
#   1d:  10 years
interval_targets_days:
  "1m":  365
  "3m":  365
  "5m":  1825    # 5 years
  "15m": 1825    # 5 years
  "30m": 1825    # 5 years
  "1h":  3650    # 10 years
  "4h":  3650    # 10 years
  "8h":  3650    # 10 years
  "12h": 3650    # 10 years
  "1d":  3650    # 10 years

# Absolute ceiling regardless of any per-interval target. 10 years in days.
absolute_max_days: 3650

# Skip the most-recent N days when backfilling pairs that already
# exist in the database. Intended for coordination with a separate
# "live" backfill process that handles the recent window. Set to 0
# to disable (backfill all the way to now, which is the legacy behavior).
# New pairs (via Cell 9's NEW_PAIRS list) always backfill fully to now
# regardless of this value.
recent_days_owned_by_other_process: 7

# Exchange definitions. To add a new exchange (e.g., kraken):
#   1. Add an entry under `exchanges:` with base_url, request delay, max_per_request.
#   2. Add interval mappings under `interval_map`.
#   3. Implement a fetcher + ingester function in the notebook following the
#      existing patterns for binance/mexc/nonkyc/coinbase. Kraken's OHLC endpoint
#      is /0/public/OHLC and returns arrays keyed by pair name.
exchanges:
  nonkyc:
    base_url: "https://api.nonkyc.io/api/v2"
    request_delay_seconds: 0.0    # ignored — token bucket handles pacing
    max_per_request: 5000          # validated by empirical diagnostic
    interval_map:
      "5m": 5
      "15m": 15
      "30m": 30
      "1h": 60
      "4h": 240
      "8h": 480
      "12h": 720
      "1d": 1440
      # 1m, 3m not supported by NonKYC

  binance:
    base_url: "https://api.binance.com"
    request_delay_seconds: 0.12
    max_per_request: 1000
    interval_map:
      "1m": "1m"
      "5m": "5m"
      "15m": "15m"
      "30m": "30m"
      "1h": "1h"
      "4h": "4h"
      "1d": "1d"
      #"3m": "3m"

  mexc:
    base_url: "https://api.mexc.com"
    request_delay_seconds: 0.2
    max_per_request: 500
    interval_map:
      "1m": "1m"
      "5m": "5m"
      "15m": "15m"
      "30m": "30m"
      "1h": "60m"
      "4h": "4h"
      "8h": "8h"
      "1d": "1d"
      # 3m and 12h not offered on MEXC spot

  coinbase:
    base_url: "https://api.exchange.coinbase.com"
    request_delay_seconds: 0.35
    max_per_request: 300
    interval_map:
      "1m": 60
      "5m": 300
      "15m": 900
      "1h": 3600
      "1d": 86400
      # 3m, 30m, 4h not supported on Coinbase Advanced

  # Kraken — uncomment when ready to enable.
  # Constraints: 1 req/s per IP (strict), 720 bars per response cap,
  # cannot page older than ~720 bars of history via OHLC endpoint.
  # For deep history, use Trades-aggregation mode (not yet implemented).
  kraken:
    base_url: "https://api.kraken.com"
    request_delay_seconds: 0.0    # ignored — token bucket handles pacing
    max_per_request: 720           # Kraken OHLC hard cap
    interval_map:
      "1m": 1
      "5m": 5
      "15m": 15
      "30m": 30
      "1h": 60
      "4h": 240
      "1d": 1440
      # Kraken does not support 3m, 8h, or 12h spot OHLC.
