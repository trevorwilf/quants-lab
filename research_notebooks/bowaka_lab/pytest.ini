[pytest]
testpaths = tests
markers =
    live_alpaca: requires Alpaca API credentials and internet access
    live_mongo: requires a real MongoDB instance
    live_postgres: requires a real PostgreSQL instance (OPTUNA_STORAGE pointing to Postgres)
    slow: long-running research or integration test
filterwarnings =
    ignore::DeprecationWarning
addopts = --strict-markers
