[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bowaka-lab"
version = "0.1.0"
description = "Independent Bowaka equities research and backtesting lab"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "alpaca-py>=0.30.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pymongo>=4.6",
    "motor>=3.3.2",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "exchange-calendars>=4.5",
    "optuna>=3.0",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "plotly>=5.0",
    "matplotlib>=3.7",
    "tabulate>=0.9",
    "nbformat>=5.0",
    "papermill>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mongomock>=4.0",
    "ruff>=0.5",
    "black>=24.0",
    "isort>=5.12",
    "jupyter>=1.0",
]
live = [
    "alpaca-py>=0.30.0",
]

[project.scripts]
bowaka-lab = "bowaka_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bowaka_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_alpaca: requires Alpaca API credentials and internet access",
    "live_mongo: requires a real MongoDB instance",
    "slow: long-running research or integration test",
]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120
