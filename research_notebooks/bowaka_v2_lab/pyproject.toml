[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bowaka-v2-lab"
version = "0.1.0"
description = "Bowaka v2 equities research, backtesting, and reconciliation lab (QuantsLab integration)"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "alpaca-py>=0.30.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pymongo>=4.6",
    "motor>=3.3.2",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "exchange-calendars>=4.5",
    "optuna>=3.0",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "plotly>=5.0",
    "matplotlib>=3.7",
    "tabulate>=0.9",
    "nbformat>=5.0",
    "papermill>=2.4",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.1",
    "mongomock>=4.0",
    "ruff>=0.5",
    "black>=24.0",
    "isort>=5.12",
    "jupyter>=1.0",
]
# Walk-forward numba speedup (optional). Compiled scan-feature kernels for a
# faster scan-matrix build/rebuild; default OFF and gated by
# optuna.acceleration.numba.enabled. Absent numba -> pure-Python fallback.
#   pip install -e .[numba]    then    python scripts/warm_numba_cache.py
numba = [
    "numba>=0.60.0",
]

[project.scripts]
bowaka-v2-lab = "bowaka_v2_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bowaka_v2_lab*"]

[tool.pytest.ini_options]
# Single source of truth for pytest config. There is intentionally no separate
# pytest.ini — see docs/audits/2026-05-22_realism_audit.md §P1-007 (Phase 2:
# deterministic CI handling). A non-None default timeout guarantees the suite
# fails deterministically on a hang instead of stalling the run window.
testpaths = ["tests"]
# Default per-test timeout (seconds). The thread method prints a stack trace on
# timeout. Genuinely long tests (real backtests / walk-forward studies / notebook
# execution) must carry an explicit @pytest.mark.timeout(N) override OR be marked
# @pytest.mark.slow (deselected by the comprehensive `-m "not slow"` filter).
timeout = 60
timeout_method = "thread"
addopts = "--strict-markers --junitxml=artifacts/test-junit.xml"
markers = [
    "live_alpaca: requires Alpaca API credentials and internet access",
    "live_mongo: requires a real MongoDB instance",
    "live_paper: requires BOWAKA_V2_PAPER_LOGS_ROOT pointing at real paper logs",
    "slow: long-running research or integration test",
    "sip_required: SIP feed required (skipped on IEX-only test envs)",
    "integration: integration-level test (tests/integration)",
    "reconcile: paper-vs-sim reconciliation test (tests/reconcile)",
    "parity: actual-contract parity test (tests/parity)",
    "unit: fast unit test (tests/unit)",
    "notebook: notebook end-to-end execution test",
    "synthetic_fallback: depends on the synthetic IEX subset (real lake unavailable)",
    # Audit 2026-05-23 §P2-002 — segmentation hygiene for the slow Optuna /
    # paper-recon work. ``optuna_smoke`` selects the smoke-scale walk-forward
    # studies (use with @pytest.mark.slow so the comprehensive ``-m "not slow"``
    # filter still excludes them); ``paper_reconcile`` selects paper-vs-sim
    # reconciliation tests that need real paper logs.
    "optuna_smoke: smoke-scale Optuna walk-forward integration test",
    "paper_reconcile: paper-vs-sim reconciliation test (real paper logs required)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.ruff]
line-length = 120
target-version = "py310"
