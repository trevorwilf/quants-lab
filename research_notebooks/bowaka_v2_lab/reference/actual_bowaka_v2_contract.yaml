# ------------------------------------------------------------------
# actual_bowaka_v2_contract.yaml -- FROZEN live-strategy contract.
#
# Machine-readable snapshot of the live Bowaka v2 config
# (${BOWAKA_V2_SOURCE_ROOT}/bowaka_v2_config.yaml), pinned at the
# 2026-05-21 realism remediation. The lab simulator must reproduce
# this contract; Phase 1's config-parity diff is checked against it.
#
# DO NOT hand-edit. Regenerate with:
#   python -m bowaka_v2_lab.reference
# (Phase 1 also adds the `bowaka-v2-lab import-actual-config` command.)
#
# source_sha256 is the SHA-256 of the live config file bytes; the
# tests/parity/ suite flags drift between this snapshot and live.
# ------------------------------------------------------------------
contract_schema_version: 3
data:
  allow_non_sip_for_research_only: true
  daily_timeframe: 1D
  fail_on_missing_baseline: true
  feed: iex
  intraday_timeframe: 1m
  live_requires_sip: true
  max_bar_age_seconds: 90
  max_quote_age_seconds: 15
  min_history_trading_days: 45
  provider: alpaca
  require_adjusted_daily_bars: true
  require_split_adjustment: true
  timezone: America/New_York
execution:
  bracket_pricing_mode: actual_fill
  default_venue_code: XNAS
  halt_gate:
    block_on_halt_or_pending_review: true
    block_on_recent_luld_pause: true
    enabled: true
  marketable_limit_slippage_pct: 0.005
  marketable_limit_timeout_seconds: 30
  parent_order_style: market
  price_chase_gate:
    enabled: true
    max_pct_above_signal_price: 0.1
    min_pct_below_signal_price: -0.03
  quote_gate:
    enabled: true
    max_quote_age_seconds: 15
    max_spread_pct: 0.01
    require_bid_ask_positive: true
exits:
  max_hold_days: 3
  signal_fade:
    enabled: true
    eval_time: '15:45'
    exit_on:
    - hard
    - critical
    initial_mode: telemetry_then_active_after_validation
    marketable_limit_offset_pct: 0.005
    order_style: marketable_limit
    score_thresholds:
      critical: 0.67
      hard: 0.5
      soft: 0.34
    telemetry_time: '16:05'
  stop_pct: 0.025
  target_pct: 0.15
  time_stop:
    enabled: true
    exit_time: '15:45'
historical_features:
  atr_days: 14
  ema_days: 10
  ema_slope_lookback: 3
  lookback_days: 20
  volume_curve:
    bucket_edges:
    - 250000
    - 500000
    - 1000000
    - 5000000
    - 20000000
    fallback_opening_15m_share: 0.08
    min_days_for_symbol_curve: 20
    mode: adv_bucket
risk:
  adv_tier_caps:
  - max_adv_dollars: 250000
    reject_if_below: true
  - max_adv_dollars: 500000
    max_position_as_adv_frac: 0.003
  - max_adv_dollars: 1000000
    max_position_as_adv_frac: 0.005
  - max_adv_dollars: 5000000
    max_position_as_adv_frac: 0.01
  - max_adv_dollars: null
    max_position_as_adv_frac: 0.015
  daily_loss_pct: 0.03
  max_gross_exposure_pct: 0.8
  max_lots_per_symbol: 3
  max_stopouts_per_day: 2
  max_total_entries_per_day: 10
  shadow:
    adv_tier_caps:
    - max_adv_dollars: 250000
      reject_if_below: true
    - max_adv_dollars: 500000
      max_position_as_adv_frac: 0.002
    - max_adv_dollars: 1000000
      max_position_as_adv_frac: 0.003
    - max_adv_dollars: 5000000
      max_position_as_adv_frac: 0.005
    - max_adv_dollars: null
      max_position_as_adv_frac: 0.01
    daily_loss_pct: 0.01
    max_gross_exposure_pct: 0.4
    max_total_entries_per_day: 4
  stop_trading_after_consecutive_stopouts: 2
  strategy_slice_loss_pct: 0.025
scanner:
  debug_gate_dump: true
  enabled: true
  full_universe_refresh_interval_minutes: 5
  in_play_refresh_interval_seconds: 60
  max_candidates_per_scan: 25
  max_entries_per_scan: 3
  require_fresh_intraday_bar: true
  require_prior_daily_baseline: true
  same_symbol_entries_per_day: 1
  scan_interval_seconds: 60
  signal_expiry_seconds: 600
  symbol_cooldown_minutes: 390
score:
  bounded: true
  close_location_weight: 0.75
  ema_distance_score_cap: 0.4
  ema_slope_score_cap: 0.25
  gap_penalty_above: 0.25
  range_score_cap: 2.5
  rvol_score_cap: 5.0
session:
  end: '15:55'
  loop_interval_seconds: 5
  scanner_end: '15:30'
  scanner_start: 09:45
  start: 09:30
  timezone: America/New_York
signals:
  avg_dollar_volume_max: null
  avg_dollar_volume_min: 250000
  close_location_so_far_min: 0.6
  current_return_pct_max: 0.5
  ema_distance_min: -0.05
  ema_slope_min: -0.05
  gap_pct_max: 0.25
  price_max: 20.0
  price_min: 1.0
  prior_atr_pct_min: 0.06
  projected_full_day_rvol_max: 8.0
  projected_full_day_rvol_min: 0.5
  range_expansion_so_far_max: 2.5
  range_expansion_so_far_min: 0.5
  rvol_so_far_max: 8.0
  rvol_so_far_min: 0.7
sizing:
  bankroll_fixed_dollars: 90000
  equal_slice_bankroll_fraction: 0.8
  max_concurrent_positions: 18
  max_per_trade_dollars: null
  min_order_notional: 500
  sizing_mode: equal_slice
  target_risk_dollars: 200
