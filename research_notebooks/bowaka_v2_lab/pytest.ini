[pytest]
testpaths = tests
markers =
    live_alpaca: requires Alpaca API credentials and internet access
    live_mongo: requires a real MongoDB instance
    live_paper: requires BOWAKA_V2_PAPER_LOGS_ROOT pointing at real paper logs
    slow: long-running research or integration test
    sip_required: SIP feed required (skipped on IEX-only test envs)
filterwarnings =
    ignore::DeprecationWarning
addopts = --strict-markers
