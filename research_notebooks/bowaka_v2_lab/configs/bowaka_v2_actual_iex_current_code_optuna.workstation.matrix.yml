# ------------------------------------------------------------------
# WORKSTATION PROFILE (speedup report v2 §4 P2 / §5.4 / Phase 2 task 3).
#
# IMPORTANT — the memory budget is sized against the CONTAINER, not the host.
# The host has 192 GiB / 28 cores, but Notebook 10 / studies run inside the
# ql-jupyter container, which WSL2 caps at ~157 GiB (.wslconfig memory=160GB).
# MemoryBudget.from_system() reads the CONTAINER total. So the effective
# worker budget is:
#     157.2 - 62 (reserve) - 16 (emergency) - 8 (postgres) = 71.2 GiB
# At worker_private_gib_estimate=6.0 GiB that fits floor(71.2/6) = 11 workers.
#
# 2026-05-28: n_jobs set to 10 (operator decision).
#   * A 16-worker flip was attempted and REVERTED: 16*6=96 GiB > 71.2 GiB
#     container budget, so strict_parallel hard-failed at preflight. (The
#     earlier "16 fits" check was run on the HOST's 192 GiB by mistake, not
#     the container's 157 GiB.)
#   * 10 workers = 10*6 = 60 GiB <= 71.2 (~11 GiB spare) — a 25% throughput
#     gain over 8, comfortably inside the container budget. (11 is the
#     mathematical max but leaves only ~5 GiB spare.)
#   * Parity is structurally guaranteed — each trial is a deterministic,
#     independently-seeded backtest; n_jobs only changes how Optuna
#     distributes trials, never an individual trial's result.
# The dispatcher enforces effective_n_jobs = min(n_jobs, parallel.max_workers);
# BOTH are set to 10 below so neither binds first.
#
# To go higher than 11, EITHER lower worker_private_gib_estimate after
# MEASURING real per-worker RSS under load (the serial full-universe run
# peaked <2 GiB, so 6 GiB is likely ~3x conservative), OR raise the WSL2
# memory cap so the container sees more of the 192 GiB host. Do not raise
# the count without one of those — strict_parallel will hard-fail.
# ------------------------------------------------------------------
artifacts:
  write_jsonl: true
  write_parquet: true
backtest:
  cost_stress: conservative
  end_date: '2026-05-20'
  entry_delay_minutes: 0
  start_date: '2023-11-27'
execution:
  limit_offset_bps: 50
  max_quote_age_seconds: 15
  max_spread_bps: 100
  order_type: market
exits:
  max_hold_days: 3
  signal_fade:
    enabled: true
    eval_time: '15:45'
    exit_on:
    - hard
    - critical
    initial_mode: telemetry_then_active_after_validation
    marketable_limit_offset_pct: 0.005
    order_style: marketable_limit
    score_thresholds:
      critical: 0.67
      hard: 0.5
      soft: 0.34
    telemetry_time: '16:05'
  stop_pct: 0.025
  target_pct: 0.15
  time_stop:
    enabled: true
    exit_time: '15:45'
finalist_evaluation:
  full_artifacts: true
  include_incumbent: true
  local_parameter_perturbation:
    enabled: true
    max_neighbors_per_param: 2
    relative_delta: 0.05
  score_final_holdout: true
  stress_scenarios:
  - name: wider_spreads
    overrides:
      execution.max_spread_bps_multiplier: 1.5
  - name: stale_quote_pressure
    overrides:
      execution.max_quote_age_seconds_multiplier: 0.5
  - name: higher_cost_stress
    overrides:
      backtest.cost_stress: aggressive
  top_k: 15
market_data:
  allow_non_sip_for_research_only: true
  assume_naive_timezone: false
  daily_bar_source: alpaca
  feed: iex
  max_bar_age_seconds: 90
  max_quote_age_seconds: 15
  minute_bar_source: alpaca
  quote_source: alpaca
  require_adjusted_daily_bars: true
  require_split_adjustment: true
optuna:
  acceleration:
    # Speedup report v2 hotfix 2026-05-26: flipped on in the workstation
    # overlay after the live notebook 10 run hit 9+ hours of wall-clock
    # per trial with all three default-off. Parity tests for each
    # (tests/parity/test_batch_daily_cache_*.py,
    #  tests/unit/data/test_dq_cache_invalidation.py,
    #  tests/parity/test_session_minute_window_*.py +
    #  tests/scanner/test_session_minute_window_supplier_parity.py) prove
    # byte / 1e-9 equivalence vs the legacy paths — the "benchmark-only"
    # caveat in the report was about the workstation wall-clock win;
    # correctness is locked.
    #
    # session_minute_window_cache: re-enabled 2026-05-30 after the parity
    # fix in src/bowaka_v2_lab/scanner/session_minute_window_cache.py
    # (Phase 2 of the session-minute-window-supplier parity fix — see
    # PHASE_NOTES/session_minute_window_supplier_parity_fix.md). Guarded
    # by tests/scanner/test_session_minute_window_supplier_parity.py
    # (supplier-level, 8 cases) AND
    # tests/integration/test_session_window_supplier_walkforward_parity.py
    # (end-to-end via build_fold_contexts, 1 case).
    batch_daily_cache:
      enabled: true
    startup_dq_cache:
      enabled: true
    session_minute_window_cache:
      enabled: true
    # ----------------------------------------------------------------
    # SCAN-MATRIX ENABLEMENT OVERLAY (wf scan-matrix speedup Phase 2).
    #
    # This is the ONLY committed config that turns the vectorized matrix
    # runtime ON. It is excluded from the default-disabled sweep test
    # (tests/integration/test_scan_matrix_runtime_mode_disabled_is_default.py)
    # which pins every other committed config to runtime_mode: disabled.
    #
    # PRECONDITIONS — do NOT run a study with this config until BOTH hold:
    #   1. A validation-scope matrix is built at the store_root below:
    #        python -m bowaka_v2_lab.cli scan-matrix build \
    #          --config configs/bowaka_v2_actual_iex_current_code_optuna.workstation.yml \
    #          --scope validation --workers 8 \
    #          --store-root research_notebooks/bowaka_v2_lab/artifacts/cache/scan_matrix/validation
    #   2. It is verified with the vectorized spot check, which writes
    #      <store_root>/parity_proof.json with verifier_version == 2:
    #        python -m bowaka_v2_lab.cli scan-matrix verify \
    #          --store-root <same> \
    #          --config configs/bowaka_v2_actual_iex_current_code_optuna.workstation.yml \
    #          --vectorized-check
    # Without a built+verified matrix the fold-context builder FAILS LOUD
    # (OptunaStudyInvalidError) — it will not silently fall back to the slow
    # legacy scanner. See docs/walkforward_scan_matrix_runbook.md.
    #
    # Everything else (universe, sizing, n_jobs, walkforward, search space) is
    # identical to bowaka_v2_actual_iex_current_code_optuna.workstation.yml.
    # ----------------------------------------------------------------
    scan_matrix:
      allow_full_history_matrix: false
      build_if_missing: false
      dtype_policy: float64_first
      enabled: true
      fail_on_matrix_sensitive_search_space: true
      max_optuna_workers: 8
      precompute_workers: 8
      require_parity_manifest: true
      store_root: research_notebooks/bowaka_v2_lab/artifacts/cache/scan_matrix/validation
      runtime_mode: vectorized
      scope: validation
      separate_holdout_matrix: true
      storage_format: numpy_memmap
  cached_suppliers: true
  cost_stress: conservative
  n_jobs: 10
  n_startup_trials: 25
  n_trials: 200
  objective_artifact_mode: objective_minimal
  parallel:
    blas_thread_pin: true
    max_workers: 10
    memory_reserve_gib: 62
    strict_parallel: true
  # Fold-level pruning (wf scan-matrix speedup Phase 3). A free multiplier on
  # top of the matrix: kill a trial mid-walk-forward once its running score is
  # already in the no-trade / fail-closed neighbourhood, so doomed trials stop
  # paying for every remaining fold. CONSERVATIVE by design:
  #   * min_completed_trials_before_pruning: 30 — never prune inside the TPE
  #     startup window (n_startup_trials: 25); the search must explore first.
  #   * catastrophic_floor: -1.40 — the incumbent objective is ~ -1.05 and a
  #     no-trade / degenerate fold scores ~ -1.5 (low_trade_count penalty +
  #     friends). -1.40 sits just above the no-trade floor, so a trial is
  #     pruned ONLY once it is already worse than anything plausibly
  #     promotable after a fold — never a trial near the incumbent.
  pruning:
    enabled: true
    min_completed_trials_before_pruning: 30
    catastrophic_floor: -1.40
  search_space_overrides: {}
  storage: ${OPTUNA_STORAGE:-postgresql+psycopg2://optuna:optuna@optuna-postgres:5432/optuna}
  study_name_prefix: bowaka_v2_actual_iex_current_code_parity
  walkforward:
    final_holdout_months: 5
    train_months: 21
    val_months: 1
paths:
  artifact_root: research_notebooks/bowaka_v2_lab/artifacts
  data_root: research_notebooks/bowaka_v2_lab/data
  lab_root: research_notebooks/bowaka_v2_lab
