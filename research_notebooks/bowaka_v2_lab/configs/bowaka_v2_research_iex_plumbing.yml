# Bowaka v2 research config — IEX feed.
# Used to validate end-to-end plumbing on a feed that does not support paper promotion.
# Per [Report §11.2].

strategy_id: bowaka_v2
strategy_version: "0.1.0"

# IEX is partial-tape coverage and cannot be trusted for signal research
# (see [Report 11.2]). The IEX path is end-to-end plumbing validation only,
# so it runs as smoke_fixture, not a research- or promotion-grade mode.
simulation:
  mode: smoke_fixture

market_data:
  feed: iex
  allow_non_sip_for_research_only: true
  max_bar_age_seconds: 90
  minute_bar_source: alpaca
  daily_bar_source: alpaca
  quote_source: alpaca
  assume_naive_timezone: false

session:
  calendar: XNYS
  scan_window_local_start: "09:30"
  scan_window_local_end: "15:55"
  scan_interval_seconds: 60

universe:
  asset_classes: [operating_equity]
  min_price: 1.0
  max_price: 1000.0
  min_adv_dollars: 1000000
  exclude_pattern_class: true

scanner:
  max_candidates_per_scan: 10
  max_entries_per_scan: 3
  min_signal_strength: 0.5

signals:
  allow_unknown_instrument_class_for_research: false
  # IEX-relaxed thresholds (partial-tape bias) — see actual_bowaka_v2_contract.yaml.
  rvol_so_far_min: 0.7
  projected_full_day_rvol_min: 0.5
  prior_atr_pct_min: 0.06
  range_expansion_so_far_min: 0.5
  close_location_so_far_min: 0.60
  ema_distance_min: -0.05
  ema_slope_min: -0.05
  price_min: 1.0
  price_max: 20.0
  avg_dollar_volume_min: 250000
  rvol_so_far_max: 8.0
  projected_full_day_rvol_max: 8.0
  range_expansion_so_far_max: 2.50
  gap_pct_max: 0.25
  current_return_pct_max: 0.50

execution:
  order_type: marketable_limit
  limit_offset_bps: 5
  max_quote_age_seconds: 5
  max_spread_bps: 50

sizing:
  sizing_mode: fixed_dollar
  dollars_per_position: 5000
  max_position_dollars: 25000

risk:
  max_concurrent_positions: 5
  max_total_entries_per_day: 12
  max_gross_exposure_pct: 0.50
  daily_loss_pct: 0.02
  strategy_slice_loss_pct: 0.05
  max_stopouts_per_day: 4
  stop_trading_after_consecutive_stopouts: 3
  adv_tier_caps: []

exits:
  stop_loss_pct: 0.02
  take_profit_pct: 0.06
  max_hold_days: 5
  signal_fade_mode: telemetry_only

backtest:
  start_date: "2024-09-01"
  end_date: "2024-12-31"
  cost_stress: base
  entry_delay_minutes: 0

artifacts:
  write_parquet: true
  write_jsonl: true

run:
  kind: backtest
  seed: 1337

paths:
  lab_root: research_notebooks/bowaka_v2_lab
  data_root: research_notebooks/bowaka_v2_lab/data
  artifact_root: research_notebooks/bowaka_v2_lab/artifacts
