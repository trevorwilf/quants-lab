# Bowaka v2 walk-forward Optuna config.
# Phase 9 of the realism remediation rebuilds the search space; this file
# establishes the structure. feed: iex -> simulation.mode is smoke_fixture
# (IEX is partial-tape, plumbing-only); `optuna` refuses it unless
# --allow-smoke-optimization is passed.

strategy_id: bowaka_v2
strategy_version: "0.1.0"

simulation:
  mode: smoke_fixture

market_data:
  feed: iex
  allow_non_sip_for_research_only: false
  max_bar_age_seconds: 60
  minute_bar_source: alpaca
  daily_bar_source: alpaca
  quote_source: alpaca
  assume_naive_timezone: false

session:
  calendar: XNYS
  start: "09:30"
  end: "15:55"
  scanner_start: "09:45"
  scanner_end: "15:30"
  scan_interval_seconds: 60

universe:
  asset_classes: [operating_equity]
  min_price: 1.0
  max_price: 1000.0
  min_adv_dollars: 2000000
  exclude_pattern_class: true

scanner:
  max_candidates_per_scan: 10
  max_entries_per_scan: 3
  min_signal_strength: 0.55

signals:
  allow_unknown_instrument_class_for_research: false

execution:
  order_type: marketable_limit
  limit_offset_bps: 3
  max_quote_age_seconds: 3
  max_spread_bps: 25

sizing:
  sizing_mode: fixed_dollar
  dollars_per_position: 5000
  max_position_dollars: 25000

risk:
  max_total_entries_per_day: 12
  max_gross_exposure_pct: 0.50
  daily_loss_pct: 0.02
  strategy_slice_loss_pct: 0.05
  max_stopouts_per_day: 4
  stop_trading_after_consecutive_stopouts: 3
  adv_tier_caps: []

exits:
  stop_pct: 0.02
  target_pct: 0.06
  max_hold_days: 5
  signal_fade_mode: telemetry_only

backtest:
  start_date: "2024-01-01"
  end_date: "2026-05-15"
  cost_stress: conservative
  entry_delay_minutes: 0

artifacts:
  write_parquet: true
  write_jsonl: true

run:
  kind: optuna
  seed: 1337

paths:
  lab_root: research_notebooks/bowaka_v2_lab
  data_root: research_notebooks/bowaka_v2_lab/data
  artifact_root: research_notebooks/bowaka_v2_lab/artifacts

optuna:
  storage: "${OPTUNA_STORAGE:-sqlite:///research_notebooks/bowaka_v2_lab/artifacts/optuna/local.db}"
  n_trials: 5000
  n_jobs: 1
  n_startup_trials: 500        # random-sampling trials before TPE-guided search begins
  study_name_prefix: bowaka_v2_iex2
  cost_stress: conservative
  walkforward:
    train_months: 6
    val_months: 1
    final_holdout_months: 1
  search_space_overrides: {}
