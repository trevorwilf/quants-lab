# ------------------------------------------------------------------
# GENERATED bowaka_v2 lab config (DO NOT hand-edit).
#
# Built deterministically from the frozen live-strategy contract
# (reference/actual_bowaka_v2_contract.yaml) by the contract -> config
# mapper. Regenerate with:
#   python -m bowaka_v2_lab.cli import-actual-config \
#       --out configs/<name>.yml [--feed sip|iex] \
#       [--mode intended_realism|current_code_parity] \
#       [--feed-thresholds actual|sip_tightened]
#
# Re-running the command is byte-identical. Every value under the
# schema-matching sections (session/signals/sizing/risk/exits) is
# sourced verbatim from the contract; universe/scanner/execution are
# remapped from the live schema. market_data.require_adjusted_daily_bars
# / require_split_adjustment / max_bar_age_seconds / max_quote_age_seconds
# come from the contract's data: block. Phase 1's config-parity diff
# (config_diff_vs_actual_bowaka_v2.yaml) is checked against this file.
# ------------------------------------------------------------------
#
# Walk-forward sizing rationale (2026-05-23 IEX lake snapshot)
# ------------------------------------------------------------------
# Lake range: 2023-11-27 -> 2026-05-20 (~29.8 months of IEX daily bars).
# User-supplied spec (2026-05-23 conversation):
#   - final_holdout_months = 5  (fixed).
#   - train_months >= 18        (minimum); 24 is the operator's example.
#   - holdout end = lake max    (as close to the current date as the
#                                data set will allow).
# Shipped values: train=21, val=1, final_holdout=5 -> 3 walk-forward
# folds, every fold using only real lake data (no empty-day padding).
# train=24 would need >=30 lake months (we have 29.8) and produce 0
# folds today; raise train_months toward 24 as the lake accrues data
# and regenerate via ``import-actual-config --purpose optuna``.
# ------------------------------------------------------------------
artifacts:
  write_jsonl: true
  write_parquet: true
backtest:
  cost_stress: conservative
  end_date: '2026-05-20'
  entry_delay_minutes: 0
  start_date: '2023-11-27'
execution:
  limit_offset_bps: 50
  max_quote_age_seconds: 15
  max_spread_bps: 100
  order_type: market
exits:
  max_hold_days: 3
  signal_fade:
    enabled: true
    eval_time: '15:45'
    exit_on:
    - hard
    - critical
    initial_mode: telemetry_then_active_after_validation
    marketable_limit_offset_pct: 0.005
    order_style: marketable_limit
    score_thresholds:
      critical: 0.67
      hard: 0.5
      soft: 0.34
    telemetry_time: '16:05'
  stop_pct: 0.08
  target_pct: 0.15
  time_stop:
    enabled: true
    exit_time: '15:45'
finalist_evaluation:
  full_artifacts: true
  include_incumbent: true
  local_parameter_perturbation:
    enabled: true
    max_neighbors_per_param: 2
    relative_delta: 0.05
  score_final_holdout: true
  stress_scenarios:
  - name: wider_spreads
    overrides:
      execution.max_spread_bps_multiplier: 1.5
  - name: stale_quote_pressure
    overrides:
      execution.max_quote_age_seconds_multiplier: 0.5
  - name: higher_cost_stress
    overrides:
      backtest.cost_stress: aggressive
  top_k: 15
market_data:
  allow_non_sip_for_research_only: false
  assume_naive_timezone: false
  daily_bar_source: alpaca
  feed: sip
  max_bar_age_seconds: 90
  max_quote_age_seconds: 15
  minute_bar_source: alpaca
  quote_source: alpaca
  require_adjusted_daily_bars: true
  require_split_adjustment: true
optuna:
  acceleration:
    scan_matrix:
      allow_full_history_matrix: false
      build_if_missing: false
      dtype_policy: float64_first
      enabled: false
      fail_on_matrix_sensitive_search_space: true
      max_optuna_workers: 8
      precompute_workers: 8
      require_parity_manifest: true
      root: research_notebooks/bowaka_v2_lab/artifacts/cache/scan_matrix
      scope: validation
      separate_holdout_matrix: true
      storage_format: numpy_memmap
  cached_suppliers: true
  cost_stress: conservative
  n_jobs: 8
  n_startup_trials: 25
  n_trials: 200
  objective_artifact_mode: objective_minimal
  parallel:
    blas_thread_pin: true
    max_workers: 8
    memory_reserve_gib: 32
    strict_parallel: false
  search_space_overrides: {}
  storage: ${OPTUNA_STORAGE:-postgresql+psycopg2://optuna:optuna@optuna-postgres:5432/optuna}
  study_name_prefix: bowaka_v2_actual_sip_intended_realism
  walkforward:
    final_holdout_months: 5
    train_months: 21
    val_months: 1
paths:
  artifact_root: research_notebooks/bowaka_v2_lab/artifacts
  data_root: research_notebooks/bowaka_v2_lab/data
  lab_root: research_notebooks/bowaka_v2_lab
risk:
  adv_tier_caps:
  - max_adv_dollars: 250000
    reject_if_below: true
  - max_adv_dollars: 500000
    max_position_as_adv_frac: 0.003
  - max_adv_dollars: 1000000
    max_position_as_adv_frac: 0.005
  - max_adv_dollars: 5000000
    max_position_as_adv_frac: 0.01
  - max_adv_dollars: null
    max_position_as_adv_frac: 0.015
  daily_loss_pct: 0.03
  max_gross_exposure_pct: 0.8
  max_lots_per_symbol: 3
  max_stopouts_per_day: 2
  max_total_entries_per_day: 10
  shadow:
    adv_tier_caps:
    - max_adv_dollars: 250000
      reject_if_below: true
    - max_adv_dollars: 500000
      max_position_as_adv_frac: 0.002
    - max_adv_dollars: 1000000
      max_position_as_adv_frac: 0.003
    - max_adv_dollars: 5000000
      max_position_as_adv_frac: 0.005
    - max_adv_dollars: null
      max_position_as_adv_frac: 0.01
    daily_loss_pct: 0.01
    max_gross_exposure_pct: 0.4
    max_total_entries_per_day: 4
  stop_trading_after_consecutive_stopouts: 2
  strategy_slice_loss_pct: 0.025
run:
  kind: optuna
  seed: 1337
scanner:
  debug_gate_dump: true
  enabled: true
  full_universe_refresh_interval_minutes: 5
  in_play_refresh_interval_seconds: 60
  max_candidates_per_scan: 25
  max_entries_per_scan: 3
  min_signal_strength: 0.0
  require_fresh_intraday_bar: true
  require_prior_daily_baseline: true
  same_symbol_entries_per_day: 1
  scan_interval_seconds: 60
  signal_expiry_seconds: 600
  symbol_cooldown_minutes: 390
session:
  calendar: XNYS
  end: '15:55'
  loop_interval_seconds: 5
  scanner_end: '15:30'
  scanner_start: 09:45
  start: 09:30
  timezone: America/New_York
signals:
  allow_unknown_instrument_class_for_research: false
  avg_dollar_volume_max: null
  avg_dollar_volume_min: 250000
  close_location_so_far_min: 0.6
  current_return_pct_max: 0.5
  ema_distance_min: -0.05
  ema_slope_min: -0.05
  gap_pct_max: 0.25
  price_max: 20.0
  price_min: 1.0
  prior_atr_pct_min: 0.06
  projected_full_day_rvol_max: 8.0
  projected_full_day_rvol_min: 0.5
  range_expansion_so_far_max: 2.5
  range_expansion_so_far_min: 0.5
  rvol_so_far_max: 8.0
  rvol_so_far_min: 0.7
simulation:
  mode: intended_realism
sizing:
  bankroll_fixed_dollars: 90000
  equal_slice_bankroll_fraction: 0.8
  max_concurrent_positions: 18
  max_per_trade_dollars: null
  min_order_notional: 500
  sizing_mode: equal_slice
  target_risk_dollars: 200
strategy_id: bowaka_v2
strategy_version: 0.1.0
universe:
  asset_classes:
  - operating_equity
  exclude_pattern_class: true
  max_price: 20.0
  min_adv_dollars: 250000
  min_price: 1.0
