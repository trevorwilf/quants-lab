# QUARANTINED 2026-05-22 — claims current_code_parity but materially changes execution/sizing/risk/exits. Not valid for Bowaka v2 optimization. See docs/audits/2026-05-22_realism_audit.md §P0-001.
#
# Bowaka v2 walk-forward Optuna config.
#
# simulation.mode: current_code_parity -- reproduces the live Bowaka v2 strategy
# as it actually runs (the live config is feed: iex, paper). The walk-forward
# study optimizes parameters against the real IEX market-data lake.
#
# Caveat: IEX is partial-tape coverage -- RVOL / range-expansion / projected
# full-day RVOL are biased low for names that route flow off-IEX. These results
# tune the live IEX paper setup; they are NOT a SIP-validated strategy, and
# promotion stays capped at backtesting_only. For research-grade tuning,
# backfill a SIP lake and switch to feed: sip + simulation.mode: intended_realism.

strategy_id: bowaka_v2
strategy_version: "0.1.0"

simulation:
  mode: current_code_parity

market_data:
  feed: iex
  allow_non_sip_for_research_only: false
  max_bar_age_seconds: 60
  minute_bar_source: alpaca
  daily_bar_source: alpaca
  quote_source: alpaca
  assume_naive_timezone: false

session:
  calendar: XNYS
  start: "09:30"
  end: "15:55"
  scanner_start: "09:45"
  scanner_end: "15:30"
  scan_interval_seconds: 60

universe:
  asset_classes: [operating_equity]
  min_price: 1.0
  max_price: 20.0
  min_adv_dollars: 250000
  exclude_pattern_class: true

scanner:
  max_candidates_per_scan: 10
  max_entries_per_scan: 3
  min_signal_strength: 0.55

signals:
  allow_unknown_instrument_class_for_research: false
  # Live IEX signal-gate thresholds — current_code_parity reproduces live.
  rvol_so_far_min: 0.7
  projected_full_day_rvol_min: 0.5
  prior_atr_pct_min: 0.06
  range_expansion_so_far_min: 0.5
  close_location_so_far_min: 0.60
  ema_distance_min: -0.05
  ema_slope_min: -0.05
  price_min: 1.0
  price_max: 20.0
  avg_dollar_volume_min: 250000
  rvol_so_far_max: 8.0
  projected_full_day_rvol_max: 8.0
  range_expansion_so_far_max: 2.50
  gap_pct_max: 0.25
  current_return_pct_max: 0.50

execution:
  order_type: marketable_limit
  limit_offset_bps: 3
  max_quote_age_seconds: 3
  max_spread_bps: 25

sizing:
  sizing_mode: fixed_dollar
  dollars_per_position: 5000
  max_position_dollars: 25000

risk:
  max_total_entries_per_day: 12
  max_gross_exposure_pct: 0.50
  daily_loss_pct: 0.02
  strategy_slice_loss_pct: 0.05
  max_stopouts_per_day: 4
  stop_trading_after_consecutive_stopouts: 3
  adv_tier_caps: []

exits:
  stop_pct: 0.02
  target_pct: 0.06
  max_hold_days: 5
  signal_fade_mode: telemetry_only

backtest:
  start_date: "2024-05-01"
  end_date: "2026-05-15"
  cost_stress: conservative
  entry_delay_minutes: 0

artifacts:
  write_parquet: true
  write_jsonl: true

run:
  kind: optuna
  seed: 1337

paths:
  lab_root: research_notebooks/bowaka_v2_lab
  data_root: research_notebooks/bowaka_v2_lab/data
  artifact_root: research_notebooks/bowaka_v2_lab/artifacts

optuna:
  storage: "${OPTUNA_STORAGE:-sqlite:///research_notebooks/bowaka_v2_lab/artifacts/optuna/local.db}"
  n_trials: 5000
  n_jobs: 1
  n_startup_trials: 500        # random-sampling trials before TPE-guided search begins
  study_name_prefix: bowaka_v2_iex2
  cost_stress: conservative
  walkforward:
    train_months: 6
    val_months: 1
    final_holdout_months: 5
  search_space_overrides: {}
