  projected_full_day_rvol_max: 4.389998623160714
  projected_full_day_rvol_min: 2.958226768828195
  range_expansion_so_far_max: 3.435850844675855
  range_expansion_so_far_min: 2.3313429453194527
  rvol_so_far_max: 15.063383404911255
  rvol_so_far_min: 2.180766810003851
simulation:
