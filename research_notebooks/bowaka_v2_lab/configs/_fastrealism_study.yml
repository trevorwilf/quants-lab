artifacts:
  write_jsonl: true
  write_parquet: true
backtest:
  cost_stress: conservative
  # DYNAMIC window (default): 'auto' anchors to the freshest lake session so the
  # weekly cron matrix rebuild + notebook 10 resolve to the SAME window (latest
  # data). end_date='auto' -> latest daily session; start_date='auto' -> derived
  # backward to keep exactly optuna.walkforward.n_folds folds. To FREEZE, replace
  # either with an explicit 'YYYY-MM-DD' (e.g. end_date: '2026-06-23').
  end_date: auto
  entry_delay_minutes: 0
  start_date: auto
execution:
  limit_offset_bps: 50
  max_quote_age_seconds: 68
  max_spread_bps: 198
  order_type: market
exits:
  max_hold_days: 5
  signal_fade:
    enabled: true
    eval_time: '15:45'
    exit_on:
    - hard
    - critical
    initial_mode: telemetry_then_active_after_validation
    marketable_limit_offset_pct: 0.005
    order_style: marketable_limit
    score_thresholds:
      critical: 0.4997581073
      hard: 0.3943120795
      soft: 0.156500767
    telemetry_time: '16:05'
  stop_pct: 0.1896328255554003
  target_pct: 0.4464470988
  time_stop:
    enabled: true
    exit_time: '15:15'
finalist_evaluation:
  full_artifacts: true
  include_incumbent: true
  local_parameter_perturbation:
    enabled: true
    max_neighbors_per_param: 2
    relative_delta: 0.05
  score_final_holdout: true
  stress_scenarios:
  - name: wider_spreads
    overrides:
      execution.max_spread_bps_multiplier: 1.5
  - name: stale_quote_pressure
    overrides:
      execution.max_quote_age_seconds_multiplier: 0.5
  - name: higher_cost_stress
    overrides:
      backtest.cost_stress: aggressive
  top_k: 15
market_data:
  allow_non_sip_for_research_only: false
  assume_naive_timezone: false
  daily_bar_source: alpaca
  feed: sip
  max_bar_age_seconds: 90
  max_quote_age_seconds: 15
  minute_bar_source: alpaca
  quote_source: alpaca
  require_adjusted_daily_bars: true
  require_split_adjustment: true
  # Group-0 de-risk (speedup investigation 2026-06-16): pin the lake root in the
  # config so it no longer depends on the MARKET_DATA_ROOT env var (which the
  # 2026-06-15 volume-migration recreate wiped from the container). Without this
  # the runtime resolves the slow 9p in-repo mount -> the scan-matrix config hash
  # mismatches the built matrix (-> fail-loud matrix miss). This value reproduces
  # the built matrix's config_input_hash (verified: sha256:283fce5d...).
  shared_root: /opt/market_data_cache
optuna:
  acceleration:
    # c1 (speedup investigation 2026-06-16) — the three per-fold DQ/IO caches.
    # With these OFF, ~93% of every trial is the data-quality rebuild (~24k
    # daily-parquet re-reads/fold). All three are parity-tested (tests/parity/
    # test_dq_cache_*, test_batch_daily_cache_*, test_session_minute_window_*)
    # and produce byte-identical objectives. fast_realism is in the
    # reuse_cached_invariant_only gate (sim/backtester.run_backtest) so it gets
    # the full ~5.7x/fold skip, not just the ~1.02x key agreement. NOT in the
    # scan-matrix config_input_hash, so the built CA-current matrix stays valid.
    batch_daily_cache:
      enabled: true
    session_minute_window_cache:
      enabled: true
    startup_dq_cache:
      enabled: true
    scan_matrix:
      allow_full_history_matrix: false
      build_if_missing: false
      dtype_policy: float64_first
      enabled: true
      fail_on_matrix_sensitive_search_space: true
      max_optuna_workers: 8
      precompute_workers: 8
      require_parity_manifest: true
      root: research_notebooks/bowaka_v2_lab/artifacts/cache/scan_matrix
      runtime_mode: vectorized
      scope: validation
      separate_holdout_matrix: false
      storage_format: numpy_memmap
      store_root: /opt/scan_matrix_cache/fast_realism/validation
  cached_suppliers: true
  cost_stress: conservative
  n_jobs: 16
  n_startup_trials: 25
  n_trials: 200
  objective_artifact_mode: objective_minimal
  parallel:
    blas_thread_pin: true
    max_workers: 16
    memory_reserve_gib: 32
    strict_parallel: false
  search_space_overrides: {}
  storage: ${OPTUNA_STORAGE:-postgresql+psycopg2://optuna:optuna@optuna-postgres:5432/optuna}
  study_name_prefix: bowaka_v2_actual_sip_fast_realism
  walkforward:
    train_months: 6
    val_months: 1
    final_holdout_months: 5
    step_months: 7          # non-overlapping folds (step = train+val)
    n_folds: 3              # fixed fold count for start_date:auto backward-anchoring (3 non-overlapping folds + 5mo holdout, tests ~Oct2024/May2025/Dec2025 relative to the latest session)
paths:
  artifact_root: research_notebooks/bowaka_v2_lab/artifacts
  data_root: research_notebooks/bowaka_v2_lab/data
  lab_root: research_notebooks/bowaka_v2_lab
risk:
