# =============================================================================
# quantslab_desktop_compose.yaml
#
# Quants Lab + Optuna optimization stack for PMM Dynamic parameter tuning.
# Runs on a SEPARATE machine from the Hummingbot Trading Pod.
#
# MongoDB lives on the Trading Pod (behind VPN).  This stack connects
# to it over the LAN.  Set TRUENAS_LAN_IP in your .env or shell before
# running compose.
#
# Place this file in the ROOT of the cloned hummingbot/quants-lab repo
# (same folder as Dockerfile + environment.yml).
#
# PREREQUISITES:
#   1. Build the image first:
#        Linux/macOS:  ./Build_quantslab.sh        (add --gpu for CUDA)
#        Windows:      .\Build_quantslab.ps1       (add -Gpu for CUDA)
#      OR let compose build it:
#        docker compose -f quantslab_desktop_compose.yaml build
#   2. Trading pod is running with hummingbot_App_mongodb.yaml overlay
#   3. Port 27017 is punched through Gluetun on the trading pod
#   4. Set variables in a local .env file (see below)
#
# Required .env variables:
#   TRUENAS_LAN_IP=192.168.1.54
#   JUPYTER_TOKEN=<your-token>
#   MONGO_ROOT_PASSWORD=<mongo-password>
#
# Usage:
#   docker compose -f quantslab_desktop_compose.yaml up -d
#   docker compose -f quantslab_desktop_compose.yaml logs -f ql-jupyter
#
# GPU check (optional):
#   docker compose -f quantslab_desktop_compose.yaml run --rm gpu-check
# =============================================================================

name: quantslab_desktop

services:

  # ── Postgres for Optuna study storage ───────────────────────────────────
  optuna-postgres:
    image: postgres:16
    container_name: ql-optuna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: optuna
      POSTGRES_PASSWORD: optuna
      POSTGRES_DB: optuna
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ql_optuna_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optuna -d optuna"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ── Optuna Dashboard (web UI for viewing optimization studies) ──────────
  optuna-dashboard:
    image: ghcr.io/optuna/optuna-dashboard:latest
    container_name: ql-optuna-dashboard
    restart: unless-stopped
    depends_on:
      optuna-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    command:
      - "postgresql+psycopg2://optuna:optuna@optuna-postgres:5432/optuna"

  # ── Quants Lab JupyterLab ──────────────────────────────────────────────
  quantslab-jupyter:
    # Build locally if the image doesn't exist yet.
    # Preferred: run Build_quantslab.sh/.ps1 first, then this is a no-op.
    build:
      context: .
      dockerfile: Dockerfile
    image: hummingbot/quants-lab:desktop
    container_name: ql-jupyter
    restart: unless-stopped
    init: true
    depends_on:
      optuna-postgres:
        condition: service_healthy

    # RTX 4090 GPU access (requires NVIDIA Container Toolkit)
    # Comment out the deploy block if running without a GPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    shm_size: "8g"

    environment:
      # ── MongoDB on the Trading Pod (over LAN) ──
      MONGO_URI: "mongodb://admin:${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}@${TRUENAS_LAN_IP:?Set TRUENAS_LAN_IP in .env}:27017/quants_lab?authSource=admin&retryWrites=true&w=majority"
      MONGO_DATABASE: "quants_lab"

      # ── Optuna Postgres (local to this stack) ──
      OPTUNA_STORAGE: "postgresql+psycopg2://optuna:optuna@optuna-postgres:5432/optuna"

      # ── Market-data lake (persistent named volume at /opt/market_data_cache) ──
      # Pin the lake root so resolve_lake_root() / the DQ-cache key / the scan-matrix
      # config_input_hash all resolve the fast native-FS lake instead of silently
      # falling back to the slow 9p in-repo mount. The 2026-06-15 volume-migration
      # recreate dropped this from the container env, which routed studies to the wrong
      # lake AND mismatched the built scan matrix's config hash (fail-loud matrix miss).
      MARKET_DATA_ROOT: "/opt/market_data_cache"

      # Threading — pinned to 1 to prevent thread oversubscription with multi-worker Optuna
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"

      # Jupyter
      JUPYTER_TOKEN: "${JUPYTER_TOKEN:-change-me}"
      PYTHONUNBUFFERED: "1"
      TZ: "America/Boise"

      # instack postgres server
      HBOT_DB_URL: "postgresql+psycopg2://hbot:${POSTGRES_PASSWORD}@${TRUENAS_LAN_IP}:5432/hummingbot_api"

    volumes:
      # Persistent named volumes for the market-data lake + scan-matrix cache. These
      # MUST be named volumes (NOT the container overlay) so 80GB+ of bars/quotes/
      # trades/auctions/halts/corporate_actions survive a container recreate. They live
      # on the WSL2 ext4 (native-FS speed, NOT the slow 9p repo bind). Same paths the
      # backfill scripts + notebook-10 study/matrices use (MARKET_DATA_ROOT=/opt/market_data_cache).
      - ./:/quants-lab
      - ql_market_data:/opt/market_data_cache
      - ql_scan_matrix:/opt/scan_matrix_cache

    ports:
      - "127.0.0.1:8888:8888"

    # All base packages (psycopg2, optuna, pymongo, etc.) are baked into
    # the image via environment.yml.  Only GPU packages are installed at
    # runtime since they're large and optional.
    #
    # If you built with --gpu / -Gpu, the runtime install is a fast no-op.
    command:
      - bash
      - -lc
      - |
          set -e

          # GPU packages — skipped silently if already installed via --gpu build
          conda run --no-capture-output -n quants-lab pip install --quiet --no-cache-dir \
            "cupy-cuda12x[ctk]" "numba-cuda[cu12]" 2>/dev/null || \
            echo "Note: GPU packages not installed (no CUDA toolkit found). CPU-only mode."

          # Lab runtime deps NOT baked into the image env (environment.yml). The container
          # overlay is reset on every recreate, so reinstall them on startup -> the conda env
          # self-heals (matching the persistent ql_market_data / ql_scan_matrix volumes).
          # Without these, the scan-matrix build (exchange-calendars), Alpaca backfills
          # (alpaca-py), reports (matplotlib) + logging (structlog), the weekly headless
          # notebook-10 run (papermill) + CMA-ES refine studies (cmaes) break after a recreate.
          conda run --no-capture-output -n quants-lab pip install --quiet --no-cache-dir \
            alpaca-py exchange-calendars matplotlib structlog papermill cmaes || \
            echo "WARN: lab runtime dep install failed -- build/backfills/reports may break."

          exec conda run --no-capture-output -n quants-lab \
            jupyter lab \
            --ip=0.0.0.0 \
            --port=8888 \
            --no-browser \
            --allow-root \
            --ServerApp.token="${JUPYTER_TOKEN}" \
            --ServerApp.root_dir=/quants-lab

    healthcheck:
      # `curl` is NOT in the image and /api/status returns 403 without a token, so the old
      # curl-based check always reported "unhealthy". Use the base python (always present)
      # against /api, which returns 200 without auth; urlopen raises (non-zero) on any failure.
      test: ["CMD", "/opt/conda/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8888/api', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ── GPU sanity check (run manually) ────────────────────────────────────
  gpu-check:
    image: nvidia/cuda:12.4.1-base-ubuntu22.04
    container_name: ql-gpu-check
    profiles: ["tools"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: ["bash", "-lc"]
    command: ["nvidia-smi"]

volumes:
  ql_optuna_pgdata:
  # EXTERNAL (pre-created via `docker volume create`) so they (a) keep their exact names
  # without the compose "quantslab_desktop_" project prefix, and (b) are NOT deleted by
  # `docker compose down -v` -- the ~80GB lake + matrices are precious + slow to rebuild.
  # One-time create on a fresh host:  docker volume create ql_market_data ql_scan_matrix
  ql_market_data:    # market-data lake: bars/quotes/quotes_fine/trades/auctions/statuses/corporate_actions (~80GB+)
    external: true
    name: ql_market_data
  ql_scan_matrix:    # scan-matrix cache (rebuildable, but persisted to avoid ~98min rebuilds)
    external: true
    name: ql_scan_matrix
